<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Anuja Iduranga — Reliable by Design</title>
<desc id="desc">A vintage parchment-style GitHub profile banner with classical Greek ornament, reaching hands, and an elegant serif title.</desc>
